name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: Backend/go.sum

      - name: Build
        run: |
          cd Backend
          go build -v ./...

  frontend:
    name: Frontend (Vue + Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd Frontend
          bun install --frozen-lockfile

      - name: Lint
        run: |
          cd Frontend
          bun run lint

      - name: Type Check
        run: |
          cd Frontend
          bun run type-check

      - name: Build
        run: |
          cd Frontend
          bun run build-only
